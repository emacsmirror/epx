name: CI

on:
  push:
    branches:
      - 'master'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: codeberg-tiny
    container:
      image: node:24-bookworm-slim
    env:
      PACKAGE_LINT_DIR: package-lint
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates emacs-nox git

      - name: Check out repository
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Set up package-lint
        run: git clone --depth 1 https://github.com/purcell/package-lint.git "$PACKAGE_LINT_DIR"

      - name: Byte compile
        run: |
          emacs --batch \
            --eval '(progn
                      (setq byte-compile-error-on-warn t)
                      (byte-compile-file "epx.el"))'

      - name: Checkdoc
        run: |
          emacs --batch \
            --eval "(progn
                      (require 'checkdoc)
                      (checkdoc-file \"epx.el\"))"

      - name: Package lint
        run: |
          emacs --batch \
            --load "$PACKAGE_LINT_DIR/package-lint.el" \
            --funcall package-lint-batch-and-exit "epx.el"
